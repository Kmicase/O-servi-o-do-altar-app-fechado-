<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Cat Parade Arcade</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Fredoka:wght@600;700&display=swap');

    :root {
      --neon-pink: #ff007f;
      --neon-cyan: #00f3ff;
      --neon-yellow: #ffe600;
      --neon-green: #00ff66;
      --neon-orange: #ff9900;
      --bg-dark: #0b0512;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 20%, #2a085c 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, #4a0040 0%, transparent 50%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 10px;
      overflow: hidden;
      touch-action: none;
    }

    header {
      text-align: center;
      margin-top: 2px;
      z-index: 10;
      width: 100%;
      max-width: 500px;
    }

    h1 {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 2rem;
      letter-spacing: 2px;
      background: linear-gradient(180deg, #fff 30%, var(--neon-pink) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(255, 0, 127, 0.5));
      text-transform: uppercase;
    }

    .hud {
      display: flex;
      gap: 10px;
      margin-top: 4px;
      justify-content: center;
    }

    .hud-box {
      background: rgba(255, 255, 255, 0.07);
      border: 2px solid rgba(255, 255, 255, 0.2);
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 0.9rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }

    .hud-box span {
      color: var(--neon-yellow);
      font-weight: bold;
    }

    /* Arena do Jogo */
    .game-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 6px;
    }

    canvas {
      background: rgba(13, 6, 20, 0.9);
      border: 3px solid var(--neon-pink);
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.3);
      max-width: 92vw;
      max-height: 42vh;
    }

    /* Controles Virtuais Touch Ampliados */
    .controls-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 12px;
      z-index: 20;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 72px);
      grid-template-rows: repeat(2, 65px);
      gap: 8px;
      justify-content: center;
    }

    .btn-arrow {
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid var(--neon-pink);
      color: #fff;
      font-size: 1.8rem;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3);
      transition: background 0.08s, transform 0.08s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-arrow:active {
      background: var(--neon-pink);
      color: #000;
      transform: scale(0.9);
    }

    .btn-up { grid-column: 2; grid-row: 1; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }

    /* Modal e Seleção de Dificuldade */
    .modal {
      display: flex;
      position: fixed;
      inset: 0;
      background: rgba(11, 5, 18, 0.94);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .modal-box {
      background: rgba(255, 255, 255, 0.05);
      border: 3px solid var(--neon-yellow);
      padding: 25px 20px;
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 0 50px rgba(255, 230, 0, 0.4);
      max-width: 380px;
      width: 90%;
    }

    .modal-box h2 {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 2.2rem;
      color: var(--neon-yellow);
      text-shadow: 0 0 20px var(--neon-yellow);
      margin-bottom: 8px;
    }

    .diff-selector {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 15px 0;
    }

    .diff-label {
      font-size: 0.95rem;
      color: #aaa;
    }

    .diff-buttons {
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .btn-diff {
      flex: 1;
      padding: 8px 0;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-diff.active {
      border-color: var(--neon-pink);
      background: var(--neon-pink);
      color: #fff;
      box-shadow: 0 0 12px var(--neon-pink);
    }

    .input-player {
      width: 100%;
      padding: 10px 15px;
      margin-top: 10px;
      border-radius: 12px;
      border: 2px solid var(--neon-cyan);
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 1rem;
      text-align: center;
      outline: none;
    }

    .btn-start {
      background: var(--neon-green);
      color: #000;
      border: none;
      padding: 12px 35px;
      font-size: 1.2rem;
      font-weight: 900;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 0 20px var(--neon-green);
      transition: transform 0.1s;
      width: 100%;
    }

    .btn-start:active {
      transform: scale(0.95);
    }

    .btn-ranking {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      margin-top: 8px;
      display: inline-block;
      text-decoration: none;
    }
  </style>

  <!-- Importação do Firebase Config local -->
  <script type="module" src="config-firebase.js"></script>
</head>
<body>

  <header>
    <h1>CAT PARADE 🐱</h1>
    <div class="hud">
      <div class="hud-box">GATINHOS: <span id="score">1</span></div>
      <div class="hud-box">RECORDE: <span id="highscore">1</span></div>
    </div>
  </header>

  <div class="game-container">
    <canvas id="gameCanvas" width="360" height="360"></canvas>
  </div>

  <!-- Controles Virtuais para Celular -->
  <div class="controls-wrapper">
    <div class="controls">
      <button class="btn-arrow btn-up" onclick="changeDir('UP')">▲</button>
      <button class="btn-arrow btn-left" onclick="changeDir('LEFT')">◄</button>
      <button class="btn-arrow btn-down" onclick="changeDir('DOWN')">▼</button>
      <button class="btn-arrow btn-right" onclick="changeDir('RIGHT')">►</button>
    </div>
  </div>

  <!-- Modal Inicial / Game Over / Dificuldade -->
  <div class="modal" id="gameModal">
    <div class="modal-box">
      <h2 id="modalTitle">CAT PARADE 🐾</h2>
      <p id="modalSub" style="font-size: 1rem; color: #ccc;">Pegue os peixinhos para formar uma caravana de gatinhos!</p>
      
      <!-- Entrada do Nome do Jogador -->
      <div id="playerInputContainer" style="margin-top: 10px;">
        <input type="text" id="playerName" class="input-player" placeholder="Digite seu Nome / Nickname" maxlength="15">
      </div>

      <div class="diff-selector" id="diffSelector">
        <div class="diff-label">VELOCIDADE</div>
        <div class="diff-buttons">
          <button class="btn-diff active" onclick="setDifficulty('easy', this)">LENTO</button>
          <button class="btn-diff" onclick="setDifficulty('medium', this)">MÉDIO</button>
          <button class="btn-diff" onclick="setDifficulty('hard', this)">RÁPIDO</button>
          <button class="btn-diff" onclick="setDifficulty('insane', this)">INSANO</button>
        </div>
      </div>

      <button class="btn-start" onclick="startGame()">JOGAR</button>
      <br>
      <a href="ranking.html?jogo=cobrinha" class="btn-ranking">🏆 Ver Ranking Geral</a>
    </div>
  </div>

  <script type="module">
    import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    const catColors = [
      '#ff9900', // Laranja
      '#333333', // Preto/Cinza
      '#ffffff', // Branco
      '#ff007f', // Rosa Neon
      '#ffe600', // Amarelo
      '#00f3ff'  // Ciano
    ];

    let cats = [];
    let food = { x: 0, y: 0 };
    let dx = gridSize;
    let dy = 0;
    let nextDx = gridSize;
    let nextDy = 0;
    let score = 1;
    let highScore = localStorage.getItem('cat_highscore') || 1;
    let gameLoop = null;

    // Recupera nome anterior se existir
    const inputPlayer = document.getElementById('playerName');
    if (localStorage.getItem('user_player_name')) {
      inputPlayer.value = localStorage.getItem('user_player_name');
    }

    const difficulties = {
      easy: 260,
      medium: 180,
      hard: 120,
      insane: 75
    };
    let baseSpeed = difficulties.easy;

    document.getElementById('highscore').textContent = highScore;

    window.setDifficulty = function(diff, btn) {
      baseSpeed = difficulties[diff];
      document.querySelectorAll('.btn-diff').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'meow') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.08);
        osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
        osc.start(); osc.stop(audioCtx.currentTime + 0.18);
      } else if (type === 'over') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(250, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(70, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    window.startGame = function() {
      const nomeDigitado = inputPlayer.value.trim() || 'Gatinho Anônimo';
      localStorage.setItem('user_player_name', nomeDigitado);

      document.getElementById('gameModal').style.display = 'none';
      
      cats = [
        { x: 9 * gridSize, y: 9 * gridSize, color: catColors[0] }
      ];

      dx = gridSize;
      dy = 0;
      nextDx = gridSize;
      nextDy = 0;
      score = 1;
      document.getElementById('score').textContent = score;

      spawnFood();

      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, baseSpeed);
    };

    function spawnFood() {
      food.x = Math.floor(Math.random() * tileCount) * gridSize;
      food.y = Math.floor(Math.random() * tileCount) * gridSize;

      cats.forEach(cat => {
        if (cat.x === food.x && cat.y === food.y) {
          spawnFood();
        }
      });
    }

    function update() {
      dx = nextDx;
      dy = nextDy;

      const head = { 
        x: cats[0].x + dx, 
        y: cats[0].y + dy,
        color: cats[0].color 
      };

      if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
        gameOver();
        return;
      }

      for (let i = 0; i < cats.length; i++) {
        if (head.x === cats[i].x && head.y === cats[i].y) {
          gameOver();
          return;
        }
      }

      cats.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        playSound('meow');
        score += 1;
        document.getElementById('score').textContent = score;

        if (score > highScore) {
          highScore = score;
          localStorage.setItem('cat_highscore', highScore);
          document.getElementById('highscore').textContent = highScore;
        }

        const newCatColor = catColors[(cats.length) % catColors.length];
        cats[cats.length - 1].color = newCatColor;

        spawnFood();
      } else {
        cats.pop();
      }

      draw();
    }

    function drawCat(x, y, color, isLeader, catDx, catDy) {
      const radius = 5;

      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = isLeader ? 10 : 4;

      ctx.beginPath();
      ctx.roundRect(x + 1, y + 1, gridSize - 2, gridSize - 2, radius);
      ctx.fill();

      // Orelhas
      ctx.beginPath();
      ctx.moveTo(x + 2, y + 4);
      ctx.lineTo(x + 6, y - 3);
      ctx.lineTo(x + 8, y + 4);

      ctx.moveTo(x + gridSize - 8, y + 4);
      ctx.lineTo(x + gridSize - 6, y - 3);
      ctx.lineTo(x + gridSize - 2, y + 4);
      ctx.fill();

      ctx.shadowBlur = 0;
      
      // Olhos
      ctx.fillStyle = (color === '#333333') ? '#ffe600' : '#000000';
      
      let e1X = x + 5, e1Y = y + 7;
      let e2X = x + 13, e2Y = y + 7;

      if (isLeader) {
        if (catDx > 0) { e1X += 2; e2X += 2; }
        else if (catDx < 0) { e1X -= 2; e2X -= 2; }
        else if (catDy > 0) { e1Y += 2; e2Y += 2; }
        else if (catDy < 0) { e1Y -= 2; e2Y -= 2; }
      }

      ctx.beginPath();
      ctx.arc(e1X, e1Y, 1.8, 0, Math.PI * 2);
      ctx.arc(e2X, e2Y, 1.8, 0, Math.PI * 2);
      ctx.fill();

      // Focinho
      ctx.fillStyle = '#ff007f';
      ctx.beginPath();
      ctx.arc(x + 9.5, y + 11, 1.2, 0, Math.PI * 2);
      ctx.fill();

      // Bigodes
      ctx.strokeStyle = (color === '#333333' || color === '#ff007f') ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.5)';
      ctx.lineWidth = 1;

      ctx.beginPath(); ctx.moveTo(x + 1, y + 10); ctx.lineTo(x + 5, y + 11); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + 1, y + 13); ctx.lineTo(x + 5, y + 12); ctx.stroke();

      ctx.beginPath(); ctx.moveTo(x + gridSize - 1, y + 10); ctx.lineTo(x + gridSize - 5, y + 11); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + gridSize - 1, y + 13); ctx.lineTo(x + gridSize - 5, y + 12); ctx.stroke();
    }

    function drawFish(x, y) {
      ctx.fillStyle = '#00f3ff';
      ctx.shadowColor = '#00f3ff';
      ctx.shadowBlur = 12;

      ctx.beginPath();
      ctx.ellipse(x + 9, y + 10, 6, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(x + 14, y + 10);
      ctx.lineTo(x + 18, y + 6);
      ctx.lineTo(x + 18, y + 14);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#000';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(x + 6, y + 9, 1, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      ctx.fillStyle = '#0d0614';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      for (let i = 0; i < canvas.width; i += gridSize) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
      }

      drawFish(food.x, food.y);

      cats.forEach((cat, index) => {
        const isLeader = (index === 0);
        drawCat(cat.x, cat.y, cat.color, isLeader, dx, dy);
      });

      ctx.shadowBlur = 0;
    }

    window.changeDir = function(dir) {
      if (dir === 'UP' && dy === 0) { nextDx = 0; nextDy = -gridSize; }
      if (dir === 'DOWN' && dy === 0) { nextDx = 0; nextDy = gridSize; }
      if (dir === 'LEFT' && dx === 0) { nextDx = -gridSize; nextDy = 0; }
      if (dir === 'RIGHT' && dx === 0) { nextDx = gridSize; nextDy = 0; }
    };

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') changeDir('UP');
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') changeDir('DOWN');
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') changeDir('LEFT');
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') changeDir('RIGHT');
    });

    let touchStartX = 0;
    let touchStartY = 0;

    canvas.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    });

    canvas.addEventListener('touchend', e => {
      let diffX = e.changedTouches[0].clientX - touchStartX;
      let diffY = e.changedTouches[0].clientY - touchStartY;

      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 25) changeDir('RIGHT');
        else if (diffX < -25) changeDir('LEFT');
      } else {
        if (diffY > 25) changeDir('DOWN');
        else if (diffY < -25) changeDir('UP');
      }
    });

    // Função que salva os dados no Firebase Firestore
    async function salvarPontuacaoFirebase(nome, pontos) {
      if (!window.db) {
        console.warn("Instância do Firebase Firestore não carregada.");
        return;
      }

      try {
        await addDoc(collection(window.db, "rankings"), {
          nome: nome,
          pontos: pontos,
          jogo: "cobrinha",
          avatarSeed: localStorage.getItem('user_avatar_seed') || nome,
          avatarStyle: localStorage.getItem('user_avatar_style') || 'bottts',
          data: new Date()
        });
        console.log("Pontuação salva com sucesso no Firestore!");
      } catch (erro) {
        console.error("Erro ao salvar a pontuação no Firebase: ", erro);
      }
    }

    function gameOver() {
      playSound('over');
      clearInterval(gameLoop);

      const nomeJogador = localStorage.getItem('user_player_name') || 'Gatinho Anônimo';

      // Envia os dados para a coleção "rankings" no Firebase
      salvarPontuacaoFirebase(nomeJogador, score);

      document.getElementById('modalTitle').textContent = 'FIM DA PARADA!';
      document.getElementById('modalSub').innerHTML = `Caravana Final: <strong style="color:var(--neon-yellow);">${score} Gatinhos 🐾</strong>`;
      document.getElementById('gameModal').style.display = 'flex';
    }
  </script>
</body>
</html>
