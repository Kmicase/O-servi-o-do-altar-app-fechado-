<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jogo da Memória Litúrgico</title>
  <style>
    :root {
      --primary: #2c3e50;
      --accent: #d4af37; /* Dourado litúrgico */
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --card-back: #34495e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }

    h1 {
      color: var(--primary);
      margin-bottom: 10px;
      text-align: center;
      font-size: 1.6rem;
    }

    /* Controles de Nível */
    .level-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-level {
      padding: 8px 16px;
      border: 2px solid var(--primary);
      background-color: transparent;
      color: var(--primary);
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-level.active, .btn-level:hover {
      background-color: var(--primary);
      color: #fff;
    }

    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 15px;
      font-size: 1rem;
      color: var(--primary);
      font-weight: bold;
    }

    .game-board {
      display: grid;
      gap: 10px;
      width: 100%;
      max-width: 500px;
      perspective: 1000px;
    }

    /* Layouts dinâmicos conforme a dificuldade */
    .board-easy { grid-template-columns: repeat(3, 1fr); }
    .board-medium { grid-template-columns: repeat(4, 1fr); }
    .board-hard { grid-template-columns: repeat(4, 1fr); }

    .card {
      aspect-ratio: 1 / 1;
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.5s ease;
    }

    .card.flipped, .card.matched {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      user-select: none;
    }

    .card-front {
      background-color: var(--card-back);
      color: var(--accent);
      font-size: 1.8rem;
      border: 2px solid var(--accent);
    }

    .card-back {
      background-color: var(--card-bg);
      transform: rotateY(180deg);
      border: 2px solid #ddd;
    }

    .card-icon {
      font-size: 2rem;
    }

    .card-label {
      font-size: 0.7rem;
      color: var(--primary);
      margin-top: 4px;
      font-weight: 600;
      text-align: center;
      padding: 0 2px;
    }

    .btn-reset {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: var(--accent);
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-reset:hover {
      opacity: 0.9;
    }

    .win-message {
      display: none;
      margin-top: 15px;
      padding: 10px 15px;
      background-color: #27ae60;
      color: white;
      border-radius: 5px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Memória Litúrgica</h1>

  <div class="level-selector">
    <button class="btn-level active" onclick="changeLevel('easy')">Fácil (Coroinha)</button>
    <button class="btn-level" onclick="changeLevel('medium')">Médio (Cerimoniário)</button>
    <button class="btn-level" onclick="changeLevel('hard')">Difícil (Acólito)</button>
  </div>

  <div class="stats">
    <div>Jogadas: <span id="moves">0</span></div>
    <div>Pares: <span id="matches">0</span>/<span id="total-matches">6</span></div>
  </div>

  <div class="game-board board-easy" id="board"></div>

  <div class="win-message" id="win-message">
    Parabéns! Você concluiu o nível! 🎉
  </div>

  <button class="btn-reset" onclick="initGame()">Reiniciar Nível</button>

  <script>
    // Banco completo de objetos litúrgicos
    const allItems = [
      { name: 'Cálice', icon: '🍷' },
      { name: 'Bíblia', icon: '📖' },
      { name: 'Vela', icon: '🕯️' },
      { name: 'Cruz', icon: '✝️' },
      { name: 'Sineta', icon: '🔔' },
      { name: 'Patena', icon: '🍞' },
      { name: 'Incenso', icon: '💨' },
      { name: 'Âmbula', icon: '🏆' },
      { name: 'Galocha', icon: '🏺' },
      { name: 'Túnica', icon: '🥋' }
    ];

    // Configuração dos Níveis
    const levels = {
      easy: { count: 3, gridClass: 'board-easy' },     // 3 pares (6 cartas)
      medium: { count: 6, gridClass: 'board-medium' }, // 6 pares (12 cartas)
      hard: { count: 8, gridClass: 'board-hard' }      // 8 pares (16 cartas)
    };

    let currentLevel = 'easy';
    let cardsData = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let moves = 0;
    let lockBoard = false;

    function changeLevel(level) {
      currentLevel = level;
      
      // Atualiza os botões ativos
      document.querySelectorAll('.btn-level').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      initGame();
    }

    function initGame() {
      const board = document.getElementById('board');
      const config = levels[currentLevel];
      
      board.innerHTML = '';
      board.className = `game-board ${config.gridClass}`;
      
      flippedCards = [];
      matchedPairs = 0;
      moves = 0;
      lockBoard = false;

      document.getElementById('moves').textContent = moves;
      document.getElementById('matches').textContent = matchedPairs;
      document.getElementById('total-matches').textContent = config.count;
      document.getElementById('win-message').style.display = 'none';

      // Seleciona os itens para o nível atual e duplica para criar pares
      const selectedItems = allItems.slice(0, config.count);
      cardsData = [...selectedItems, ...selectedItems].sort(() => Math.random() - 0.5);

      // Renderiza as cartas
      cardsData.forEach((item, index) => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.index = index;
        card.dataset.name = item.name;

        card.innerHTML = `
          <div class="card-face card-front">✟</div>
          <div class="card-face card-back">
            <span class="card-icon">${item.icon}</span>
            <span class="card-label">${item.name}</span>
          </div>
        `;

        card.addEventListener('click', flipCard);
        board.appendChild(card);
      });
    }

    function flipCard() {
      if (lockBoard) return;
      if (this.classList.contains('flipped') || this.classList.contains('matched')) return;

      this.classList.add('flipped');
      flippedCards.push(this);

      if (flippedCards.length === 2) {
        checkMatch();
      }
    }

    function checkMatch() {
      moves++;
      document.getElementById('moves').textContent = moves;

      const [card1, card2] = flippedCards;
      const isMatch = card1.dataset.name === card2.dataset.name;

      if (isMatch) {
        card1.classList.add('matched');
        card2.classList.add('matched');
        matchedPairs++;
        document.getElementById('matches').textContent = matchedPairs;
        flippedCards = [];

        if (matchedPairs === levels[currentLevel].count) {
          document.getElementById('win-message').style.display = 'block';
        }
      } else {
        lockBoard = true;
        setTimeout(() => {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          flippedCards = [];
          lockBoard = false;
        }, 900);
      }
    }

    // Inicializa ao carregar a página
    initGame();
  </script>
</body>
</html>
