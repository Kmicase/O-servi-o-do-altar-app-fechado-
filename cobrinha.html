<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Snake Arcade Neon</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Fredoka:wght@600;700&display=swap');

    :root {
      --neon-pink: #ff007f;
      --neon-cyan: #00f3ff;
      --neon-yellow: #ffe600;
      --neon-green: #00ff66;
      --bg-dark: #0b0512;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 20%, #2a085c 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, #4a0040 0%, transparent 50%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 10px;
      overflow: hidden;
      touch-action: none;
    }

    header {
      text-align: center;
      margin-top: 5px;
      z-index: 10;
      width: 100%;
      max-width: 500px;
    }

    h1 {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 2.2rem;
      letter-spacing: 2px;
      background: linear-gradient(180deg, #fff 30%, var(--neon-green) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(0, 255, 102, 0.5));
      text-transform: uppercase;
    }

    .hud {
      display: flex;
      gap: 15px;
      margin-top: 5px;
      justify-content: center;
    }

    .hud-box {
      background: rgba(255, 255, 255, 0.07);
      border: 2px solid rgba(255, 255, 255, 0.2);
      padding: 6px 18px;
      border-radius: 30px;
      font-size: 1rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }

    .hud-box span {
      color: var(--neon-yellow);
      font-weight: bold;
    }

    /* Tela do Jogo */
    .game-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0;
    }

    canvas {
      background: rgba(13, 6, 20, 0.85);
      border: 3px solid var(--neon-cyan);
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.3);
    }

    /* Controles Virtuais Touch (para Celular) */
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(2, 60px);
      gap: 10px;
      margin-bottom: 10px;
      justify-content: center;
    }

    .btn-arrow {
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid var(--neon-cyan);
      color: #fff;
      font-size: 1.5rem;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
      transition: background 0.1s, transform 0.1s;
    }

    .btn-arrow:active {
      background: var(--neon-cyan);
      color: #000;
      transform: scale(0.92);
    }

    .btn-up { grid-column: 2; grid-row: 1; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }

    /* Modal Game Over / Início */
    .modal {
      display: flex;
      position: fixed;
      inset: 0;
      background: rgba(11, 5, 18, 0.92);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .modal-box {
      background: rgba(255, 255, 255, 0.05);
      border: 3px solid var(--neon-pink);
      padding: 35px 25px;
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 0 50px rgba(255, 0, 127, 0.4);
      max-width: 380px;
      width: 90%;
    }

    .modal-box h2 {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 2.5rem;
      color: var(--neon-pink);
      text-shadow: 0 0 20px var(--neon-pink);
      margin-bottom: 10px;
    }

    .btn-start {
      background: var(--neon-green);
      color: #000;
      border: none;
      padding: 14px 35px;
      font-size: 1.3rem;
      font-weight: 900;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 0 20px var(--neon-green);
      transition: transform 0.1s;
    }

    .btn-start:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <header>
    <h1>SNAKE ARCADE</h1>
    <div class="hud">
      <div class="hud-box">PONTOS: <span id="score">0</span></div>
      <div class="hud-box">RECORDE: <span id="highscore">0</span></div>
    </div>
  </header>

  <div class="game-container">
    <canvas id="gameCanvas" width="360" height="360"></canvas>
  </div>

  <!-- Botoeira Direcional para Dispositivos Móveis -->
  <div class="controls">
    <button class="btn-arrow btn-up" onclick="changeDir('UP')">▲</button>
    <button class="btn-arrow btn-left" onclick="changeDir('LEFT')">◄</button>
    <button class="btn-arrow btn-down" onclick="changeDir('DOWN')">▼</button>
    <button class="btn-arrow btn-right" onclick="changeDir('RIGHT')">►</button>
  </div>

  <!-- Tela Inicial / Game Over -->
  <div class="modal" id="gameModal">
    <div class="modal-box">
      <h2 id="modalTitle">SNAKE NEON</h2>
      <p id="modalSub" style="font-size: 1.1rem; color: #ccc;">Use as setas do teclado ou os botões na tela para jogar!</p>
      <button class="btn-start" onclick="startGame()">JOGAR</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const gridSize = 18; // Tamanho de cada bloco/célula
    const tileCount = canvas.width / gridSize; // 20x20 posições no mapa

    let snake = [];
    let food = { x: 0, y: 0 };
    let dx = gridSize;
    let dy = 0;
    let nextDx = gridSize;
    let nextDy = 0;
    let score = 0;
    let highScore = localStorage.getItem('snake_highscore') || 0;
    let gameLoop = null;
    let speed = 110; // Velocidade em ms

    document.getElementById('highscore').textContent = highScore;

    // Efeitos Sonoros Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'eat') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'over') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    function startGame() {
      document.getElementById('gameModal').style.display = 'none';
      
      // Cobra inicial (3 segmentos no meio da tela)
      snake = [
        { x: 10 * gridSize, y: 10 * gridSize },
        { x: 9 * gridSize, y: 10 * gridSize },
        { x: 8 * gridSize, y: 10 * gridSize }
      ];

      dx = gridSize;
      dy = 0;
      nextDx = gridSize;
      nextDy = 0;
      score = 0;
      speed = 110;
      document.getElementById('score').textContent = score;

      spawnFood();

      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, speed);
    }

    function spawnFood() {
      food.x = Math.floor(Math.random() * tileCount) * gridSize;
      food.y = Math.floor(Math.random() * tileCount) * gridSize;

      // Evita spawnar a comida em cima do corpo da cobra
      snake.forEach(segment => {
        if (segment.x === food.x && segment.y === food.y) {
          spawnFood();
        }
      });
    }

    function update() {
      // Atualiza direção
      dx = nextDx;
      dy = nextDy;

      // Movimenta a cabeça
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Colisão com as Paredes
      if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
        gameOver();
        return;
      }

      // Colisão com o Próprio Corpo
      for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          gameOver();
          return;
        }
      }

      snake.unshift(head);

      // Checa Alimentação
      if (head.x === food.x && head.y === food.y) {
        playSound('eat');
        score += 10;
        document.getElementById('score').textContent = score;

        if (score > highScore) {
          highScore = score;
          localStorage.setItem('snake_highscore', highScore);
          document.getElementById('highscore').textContent = highScore;
        }

        // Aumenta ligeiramente a velocidade a cada 50 pontos
        if (score % 50 === 0 && speed > 50) {
          speed -= 5;
          clearInterval(gameLoop);
          gameLoop = setInterval(update, speed);
        }

        spawnFood();
      } else {
        snake.pop(); // Remove a cauda se não comeu
      }

      draw();
    }

    function draw() {
      // Limpa Tela
      ctx.fillStyle = 'rgba(13, 6, 20, 1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Desenha Comida (Maçã Neon)
      ctx.fillStyle = '#ff007f';
      ctx.shadowColor = '#ff007f';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(food.x + gridSize / 2, food.y + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Desenha Cobra
      snake.forEach((segment, index) => {
        if (index === 0) {
          ctx.fillStyle = '#ffe600'; // Cabeça Amarela
          ctx.shadowColor = '#ffe600';
        } else {
          ctx.fillStyle = '#00ff66'; // Corpo Verde
          ctx.shadowColor = '#00ff66';
        }
        ctx.shadowBlur = 8;
        ctx.fillRect(segment.x + 1, segment.y + 1, gridSize - 2, gridSize - 2);
      });

      // Limpa efeito de brilho para otimizar desempenho
      ctx.shadowBlur = 0;
    }

    function changeDir(dir) {
      if (dir === 'UP' && dy === 0) { nextDx = 0; nextDy = -gridSize; }
      if (dir === 'DOWN' && dy === 0) { nextDx = 0; nextDy = gridSize; }
      if (dir === 'LEFT' && dx === 0) { nextDx = -gridSize; nextDy = 0; }
      if (dir === 'RIGHT' && dx === 0) { nextDx = gridSize; nextDy = 0; }
    }

    // Suporte ao Teclado
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') changeDir('UP');
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') changeDir('DOWN');
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') changeDir('LEFT');
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') changeDir('RIGHT');
    });

    // Suporte a Deslize na Tela (Swipe Gestures)
    let touchStartX = 0;
    let touchStartY = 0;

    canvas.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    });

    canvas.addEventListener('touchend', e => {
      let diffX = e.changedTouches[0].clientX - touchStartX;
      let diffY = e.changedTouches[0].clientY - touchStartY;

      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 30) changeDir('RIGHT');
        else if (diffX < -30) changeDir('LEFT');
      } else {
        if (diffY > 30) changeDir('DOWN');
        else if (diffY < -30) changeDir('UP');
      }
    });

    function gameOver() {
      playSound('over');
      clearInterval(gameLoop);

      document.getElementById('modalTitle').textContent = 'GAME OVER!';
      document.getElementById('modalSub').innerHTML = `Sua pontuação: <strong style="color:var(--neon-yellow);">${score}</strong>`;
      document.getElementById('gameModal').style.display = 'flex';
    }
  </script>
</body>
</html>
