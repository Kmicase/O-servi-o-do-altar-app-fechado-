<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jogo da Memória Litúrgico</title>
  <style>
    :root {
      --primary: #2c3e50;
      --accent: #d4af37; /* Dourado litúrgico */
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --card-back: #34495e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }

    h1 {
      color: var(--primary);
      margin-bottom: 10px;
      text-align: center;
      font-size: 1.6rem;
    }

    /* Identificação do Jogador */
    .player-setup {
      margin-bottom: 12px;
      width: 100%;
      max-width: 320px;
      text-align: center;
    }

    .input-player {
      width: 100%;
      padding: 8px 14px;
      border-radius: 20px;
      border: 2px solid var(--primary);
      background: #fff;
      color: var(--primary);
      font-size: 0.9rem;
      text-align: center;
      outline: none;
      font-weight: 600;
    }

    /* Controles de Nível */
    .level-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-level {
      padding: 8px 16px;
      border: 2px solid var(--primary);
      background-color: transparent;
      color: var(--primary);
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-level.active, .btn-level:hover {
      background-color: var(--primary);
      color: #fff;
    }

    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 15px;
      font-size: 1rem;
      color: var(--primary);
      font-weight: bold;
    }

    .game-board {
      display: grid;
      gap: 10px;
      width: 100%;
      max-width: 500px;
      perspective: 1000px;
    }

    /* Layouts dinâmicos conforme a dificuldade */
    .board-easy { grid-template-columns: repeat(3, 1fr); }
    .board-medium { grid-template-columns: repeat(4, 1fr); }
    .board-hard { grid-template-columns: repeat(4, 1fr); }

    .card {
      aspect-ratio: 1 / 1;
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.5s ease;
    }

    .card.flipped, .card.matched {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      user-select: none;
    }

    .card-front {
      background-color: var(--card-back);
      color: var(--accent);
      font-size: 1.8rem;
      border: 2px solid var(--accent);
    }

    .card-back {
      background-color: var(--card-bg);
      transform: rotateY(180deg);
      border: 2px solid #ddd;
    }

    .card-icon {
      font-size: 2rem;
    }

    .card-label {
      font-size: 0.7rem;
      color: var(--primary);
      margin-top: 4px;
      font-weight: 600;
      text-align: center;
      padding: 0 2px;
    }

    .btn-reset {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: var(--accent);
      color: #fff;
      border: none;
      border-radius: 20px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-reset:hover {
      opacity: 0.9;
    }

    .win-message {
      display: none;
      margin-top: 15px;
      padding: 15px;
      background-color: #27ae60;
      color: white;
      border-radius: 8px;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .win-stats {
      margin: 8px 0;
      font-size: 0.95rem;
      color: #f1f2f6;
    }

    .btn-ranking {
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #ffffff;
      color: #27ae60;
      border: none;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
    }
  </style>

  <!-- Importação do Firebase Config local -->
  <script type="module" src="config-firebase.js"></script>
</head>
<body>

  <h1>Memória Litúrgica</h1>

  <div class="player-setup">
    <input type="text" id="playerName" class="input-player" placeholder="Digite seu Nome / Nickname" maxlength="15">
  </div>

  <div class="level-selector">
    <button class="btn-level active" onclick="changeLevel('easy', event)">Fácil (Coroinha)</button>
    <button class="btn-level" onclick="changeLevel('medium', event)">Médio (Cerimoniário)</button>
    <button class="btn-level" onclick="changeLevel('hard', event)">Difícil (Acólito)</button>
  </div>

  <div class="stats">
    <div>Jogadas: <span id="moves">0</span></div>
    <div>Pares: <span id="matches">0</span>/<span id="total-matches">3</span></div>
  </div>

  <div class="game-board board-easy" id="board"></div>

  <div class="win-message" id="win-message">
    <p>Parabéns! Você concluiu o nível! 🎉</p>
    <div class="win-stats">Pontuação: <span id="winScore">0</span> pts</div>
    <a href="ranking.html?jogo=memoria" class="btn-ranking">🏆 Ver Ranking Geral</a>
  </div>

  <button class="btn-reset" onclick="initGame()">Reiniciar Nível</button>

  <script type="module">
    import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Entrada do Nome do Jogador
    const inputPlayer = document.getElementById('playerName');
    if (localStorage.getItem('user_player_name')) {
      inputPlayer.value = localStorage.getItem('user_player_name');
    }

    inputPlayer.addEventListener('change', () => {
      localStorage.setItem('user_player_name', inputPlayer.value.trim());
    });

    // Banco completo de objetos litúrgicos
    const allItems = [
      { name: 'Cálice', icon: '🍷' },
      { name: 'Bíblia', icon: '📖' },
      { name: 'Vela', icon: '🕯️' },
      { name: 'Cruz', icon: '✝️' },
      { name: 'Sineta', icon: '🔔' },
      { name: 'Patena', icon: '🍞' },
      { name: 'Incenso', icon: '💨' },
      { name: 'Âmbula', icon: '🏆' },
      { name: 'Galocha', icon: '🏺' },
      { name: 'Túnica', icon: '🥋' }
    ];

    // Configuração dos Níveis com Pontuação Base
    const levels = {
      easy: { count: 3, gridClass: 'board-easy', basePoints: 500 },     // 3 pares (6 cartas)
      medium: { count: 6, gridClass: 'board-medium', basePoints: 1000 }, // 6 pares (12 cartas)
      hard: { count: 8, gridClass: 'board-hard', basePoints: 1800 }      // 8 pares (16 cartas)
    };

    let currentLevel = 'easy';
    let cardsData = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let moves = 0;
    let lockBoard = false;

    window.changeLevel = function(level, e) {
      currentLevel = level;
      
      document.querySelectorAll('.btn-level').forEach(btn => btn.classList.remove('active'));
      if (e && e.target) e.target.classList.add('active');

      window.initGame();
    };

    window.initGame = function() {
      const board = document.getElementById('board');
      const config = levels[currentLevel];
      
      board.innerHTML = '';
      board.className = `game-board ${config.gridClass}`;
      
      flippedCards = [];
      matchedPairs = 0;
      moves = 0;
      lockBoard = false;

      document.getElementById('moves').textContent = moves;
      document.getElementById('matches').textContent = matchedPairs;
      document.getElementById('total-matches').textContent = config.count;
      document.getElementById('win-message').style.display = 'none';

      // Seleciona os itens para o nível atual e duplica para criar pares
      const selectedItems = allItems.slice(0, config.count);
      cardsData = [...selectedItems, ...selectedItems].sort(() => Math.random() - 0.5);

      // Renderiza as cartas
      cardsData.forEach((item, index) => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.index = index;
        card.dataset.name = item.name;

        card.innerHTML = `
          <div class="card-face card-front">✟</div>
          <div class="card-face card-back">
            <span class="card-icon">${item.icon}</span>
            <span class="card-label">${item.name}</span>
          </div>
        `;

        card.addEventListener('click', flipCard);
        board.appendChild(card);
      });
    };

    function flipCard() {
      if (lockBoard) return;
      if (this.classList.contains('flipped') || this.classList.contains('matched')) return;

      this.classList.add('flipped');
      flippedCards.push(this);

      if (flippedCards.length === 2) {
        checkMatch();
      }
    }

    async function salvarPontuacaoFirebase(nome, pontos) {
      if (!window.db) {
        console.warn("Instância do Firestore não encontrada.");
        return;
      }

      try {
        await addDoc(collection(window.db, "rankings"), {
          nome: nome,
          pontos: pontos,
          jogo: "memoria",
          dificuldade: currentLevel,
          avatarSeed: localStorage.getItem('user_avatar_seed') || nome,
          avatarStyle: localStorage.getItem('user_avatar_style') || 'bottts',
          data: new Date()
        });
        console.log("Pontuação da Memória salva no Firebase!");
      } catch (erro) {
        console.error("Erro ao salvar pontuação no Firebase: ", erro);
      }
    }

    function checkMatch() {
      moves++;
      document.getElementById('moves').textContent = moves;

      const [card1, card2] = flippedCards;
      const isMatch = card1.dataset.name === card2.dataset.name;

      if (isMatch) {
        card1.classList.add('matched');
        card2.classList.add('matched');
        matchedPairs++;
        document.getElementById('matches').textContent = matchedPairs;
        flippedCards = [];

        if (matchedPairs === levels[currentLevel].count) {
          const config = levels[currentLevel];
          const minMovesNeeded = config.count;
          const extraMoves = Math.max(0, moves - minMovesNeeded);
          const finalScore = Math.max(10, config.basePoints - (extraMoves * 40));

          const nomeJogador = inputPlayer.value.trim() || 'Anônimo';
          localStorage.setItem('user_player_name', nomeJogador);

          document.getElementById('winScore').textContent = finalScore;
          document.getElementById('win-message').style.display = 'block';

          salvarPontuacaoFirebase(nomeJogador, finalScore);
        }
      } else {
        lockBoard = true;
        setTimeout(() => {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          flippedCards = [];
          lockBoard = false;
        }, 900);
      }
    }

    // Inicializa ao carregar a página
    window.initGame();
  </script>
</body>
</html>
