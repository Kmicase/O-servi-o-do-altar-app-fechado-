<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Super Desafio Litúrgico Arcade</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Fredoka:wght@600;700&display=swap');

    :root {
      --neon-pink: #ff007f;
      --neon-cyan: #00f3ff;
      --neon-yellow: #ffe600;
      --neon-green: #00ff66;
      --bg-dark: #0d0614;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #0b0512;
      background-image: 
        radial-gradient(circle at 50% 20%, #2a085c 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, #4a0040 0%, transparent 50%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 15px;
      overflow: hidden;
      touch-action: none;
    }

    /* Animação de tremor na tela quando erra */
    body.shake {
      animation: screenShake 0.3s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes screenShake {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(5px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    /* Canvas para Partículas e Rastros */
    #fx-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99;
    }

    /* Placar Arcade */
    header {
      text-align: center;
      margin-top: 5px;
      z-index: 10;
    }

    h1 {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 2.5rem;
      letter-spacing: 2px;
      background: linear-gradient(180deg, #fff 30%, var(--neon-yellow) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(255, 230, 0, 0.5));
      text-transform: uppercase;
    }

    .hud {
      display: flex;
      gap: 12px;
      margin-top: 5px;
      justify-content: center;
    }

    .hud-box {
      background: rgba(255, 255, 255, 0.07);
      border: 2px solid rgba(255, 255, 255, 0.2);
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 1rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }

    .hud-box span {
      color: var(--neon-cyan);
      font-weight: bold;
    }

    /* Arena do Jogo */
    .arena {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 65vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    /* Portais de Destino */
    .portals-container {
      display: flex;
      width: 100%;
      gap: 20px;
      justify-content: space-between;
    }

    .portal {
      flex: 1;
      height: 170px;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      position: relative;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .portal.left {
      background: radial-gradient(circle, rgba(255, 0, 127, 0.2) 0%, rgba(13, 6, 20, 0.8) 100%);
      border: 3px solid var(--neon-pink);
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.3), inset 0 0 15px rgba(255, 0, 127, 0.2);
    }

    .portal.right {
      background: radial-gradient(circle, rgba(0, 243, 255, 0.2) 0%, rgba(13, 6, 20, 0.8) 100%);
      border: 3px solid var(--neon-cyan);
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.3), inset 0 0 15px rgba(0, 243, 255, 0.2);
    }

    .portal.drag-hover {
      transform: scale(1.08);
      filter: brightness(1.4);
    }

    .portal h2 {
      font-size: 1.4rem;
      text-transform: uppercase;
      text-align: center;
      text-shadow: 0 0 10px currentColor;
    }

    .portal.left h2 { color: var(--neon-pink); }
    .portal.right h2 { color: var(--neon-cyan); }

    .portal .icon {
      font-size: 2.8rem;
      margin-bottom: 5px;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));
    }

    /* Cartão Flutuante (3D Arcade Pop) */
    .deck {
      position: relative;
      width: 100%;
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      position: absolute;
      width: 300px;
      min-height: 120px;
      background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 100%);
      color: #111;
      border-radius: 20px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 1.2rem;
      font-weight: 700;
      box-shadow: 
        0 10px 0 #b5b5b5,
        0 15px 30px rgba(0, 0, 0, 0.6),
        0 0 20px rgba(255, 255, 255, 0.4);
      cursor: grab;
      touch-action: none;
      z-index: 20;
      transform-origin: center center;
    }

    .card:active {
      cursor: grabbing;
    }

    /* Modal de Fim de Jogo */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(11, 5, 18, 0.9);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .modal-box {
      background: rgba(255, 255, 255, 0.05);
      border: 3px solid var(--neon-yellow);
      padding: 40px;
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 0 50px rgba(ffe600, 0.4);
    }

    .modal-box h2 {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 3rem;
      color: var(--neon-yellow);
      text-shadow: 0 0 20px var(--neon-yellow);
      margin-bottom: 10px;
    }

    .btn-play {
      background: var(--neon-green);
      color: #000;
      border: none;
      padding: 15px 40px;
      font-size: 1.4rem;
      font-weight: 900;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 0 20px var(--neon-green);
      transition: transform 0.1s;
    }

    .btn-play:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <canvas id="fx-canvas"></canvas>

  <header>
    <h1>Desafio Litúrgico</h1>
    <div class="hud">
      <div class="hud-box">PONTOS: <span id="score">0</span></div>
      <div class="hud-box">COMBO: <span id="combo" style="color:var(--neon-yellow)">x1</span> 🔥</div>
      <div class="hud-box">RESTANTES: <span id="remaining">0</span></div>
    </div>
  </header>

  <div class="arena">
    <div class="portals-container">
      <div class="portal left" id="portal-palavra" data-category="palavra">
        <div class="icon">📖</div>
        <h2>Palavra</h2>
      </div>

      <div class="portal right" id="portal-eucharistia" data-category="eucharistia">
        <div class="icon">🍷</div>
        <h2>Eucaristia</h2>
      </div>
    </div>

    <div class="deck" id="deck"></div>
  </div>

  <div class="modal" id="winModal">
    <div class="modal-box">
      <h2>INCRÍVEL! ⚡</h2>
      <p style="font-size: 1.3rem;">Você completou o desafio com sucesso!</p>
      <p style="margin-top: 10px; font-size: 1.5rem;">Pontuação Total: <strong id="final-score" style="color:var(--neon-cyan)">0</strong></p>
      <button class="btn-play" onclick="initGame()">JOGAR NOVAMENTE</button>
    </div>
  </div>

  <script>
    const cardsData = [
      { text: "Proclamação do Santo Evangelho", category: "palavra" },
      { text: "Ofertório e Apresentação do Pão e Vinho", category: "eucharistia" },
      { text: "Primeira e Segunda Leitura", category: "palavra" },
      { text: "Oração Eucarística e Consagração", category: "eucharistia" },
      { text: "Cântico do Salmo Responsorial", category: "palavra" },
      { text: "Rito da Comunhão", category: "eucharistia" },
      { text: "Homilia do Celebrante", category: "palavra" },
      { text: "Cordeiro de Deus (Agnus Dei)", category: "eucharistia" }
    ];

    let cardsStack = [];
    let score = 0;
    let combo = 1;

    // --- SINTETIZADOR DE ÁUDIO RETRO (Web Audio API) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'hit') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
      } else if (type === 'error') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(90, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
      }
    }

    // --- SISTEMA DE PARTÍCULAS CANVAS ---
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function createExplosion(x, y, color) {
      for (let i = 0; i < 40; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 8 + 4,
          color,
          alpha: 1
        });
      }
    }

    function createTrail(x, y) {
      particles.push({
        x: x + (Math.random() - 0.5) * 20,
        y: y + (Math.random() - 0.5) * 20,
        vx: (Math.random() - 0.5) * 2,
        vy: (Math.random() - 0.5) * 2,
        size: Math.random() * 6 + 2,
        color: '#ffe600',
        alpha: 0.8
      });
    }

    function loopFX() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.02;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      requestAnimationFrame(loopFX);
    }
    loopFX();

    // --- LÓGICA DO JOGO ---
    function initGame() {
      score = 0;
      combo = 1;
      cardsStack = [...cardsData].sort(() => Math.random() - 0.5);
      document.getElementById('winModal').style.display = 'none';
      updateHUD();
      renderCard();
    }

    function updateHUD() {
      document.getElementById('score').textContent = score;
      document.getElementById('combo').textContent = `x${combo}`;
      document.getElementById('remaining').textContent = cardsStack.length;
    }

    function renderCard() {
      const deck = document.getElementById('deck');
      deck.innerHTML = '';

      if (cardsStack.length === 0) {
        document.getElementById('final-score').textContent = score;
        document.getElementById('winModal').style.display = 'flex';
        return;
      }

      const item = cardsStack[cardsStack.length - 1];
      const card = document.createElement('div');
      card.classList.add('card');
      card.textContent = item.text;
      card.dataset.category = item.category;

      bindPhysicsDrag(card);
      deck.appendChild(card);
    }

    // --- FÍSICA E ARRASTE "SQUASH & STRETCH" ---
    function bindPhysicsDrag(card) {
      let isDragging = false;
      let startX = 0, startY = 0;
      let curX = 0, curY = 0;
      let lastX = 0, lastY = 0;

      card.addEventListener('pointerdown', (e) => {
        isDragging = true;
        card.setPointerCapture(e.pointerId);
        startX = e.clientX - curX;
        startY = e.clientY - curY;
        lastX = e.clientX;
        lastY = e.clientY;
      });

      card.addEventListener('pointermove', (e) => {
        if (!isDragging) return;

        curX = e.clientX - startX;
        curY = e.clientY - startY;

        // Cálculo de velocidade para esticar o cartão
        const vx = e.clientX - lastX;
        const vy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;

        const speed = Math.sqrt(vx * vx + vy * vy);
        const stretch = Math.min(speed * 0.005, 0.3);
        const angle = Math.atan2(vy, vx) * (180 / Math.PI);

        // Deforma e rotaciona o cartão com base no movimento
        card.style.transform = `translate(${curX}px, ${curY}px) rotate(${vx * 0.1}deg) scale(${1 + stretch}, ${1 - stretch})`;

        // Solta partículas no caminho do rastro
        createTrail(e.clientX, e.clientY);

        // Destaque visual dos portais
        checkPortalHover(card);
      });

      card.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        card.releasePointerCapture(e.pointerId);

        const targetPortal = getHoveredPortal(card);

        if (targetPortal) {
          const isCorrect = targetPortal.dataset.category === card.dataset.category;

          if (isCorrect) {
            playSound('hit');
            const rect = targetPortal.getBoundingClientRect();
            const color = targetPortal.dataset.category === 'palavra' ? '#ff007f' : '#00f3ff';
            createExplosion(rect.left + rect.width / 2, rect.top + rect.height / 2, color);

            score += 150 * combo;
            combo += 1;
            cardsStack.pop();
            updateHUD();
            renderCard();
          } else {
            playSound('error');
            combo = 1;
            updateHUD();

            // Tremor de tela
            document.body.classList.add('shake');
            setTimeout(() => document.body.classList.remove('shake'), 300);

            // Reseta posição da carta
            card.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            card.style.transform = `translate(0px, 0px) scale(1, 1)`;
            curX = 0; curY = 0;
            setTimeout(() => card.style.transition = '', 300);
          }
        } else {
          // Soltou no vazio
          card.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
          card.style.transform = `translate(0px, 0px) scale(1, 1)`;
          curX = 0; curY = 0;
          setTimeout(() => card.style.transition = '', 300);
        }

        clearPortalHover();
      });
    }

    function checkPortalHover(card) {
      const cRect = card.getBoundingClientRect();
      document.querySelectorAll('.portal').forEach(p => {
        const pRect = p.getBoundingClientRect();
        const overlap = !(cRect.right < pRect.left || cRect.left > pRect.right || cRect.bottom < pRect.top || cRect.top > pRect.bottom);
        if (overlap) p.classList.add('drag-hover');
        else p.classList.remove('drag-hover');
      });
    }

    function getHoveredPortal(card) {
      const cRect = card.getBoundingClientRect();
      for (let p of document.querySelectorAll('.portal')) {
        const pRect = p.getBoundingClientRect();
        const overlap = !(cRect.right < pRect.left || cRect.left > pRect.right || cRect.bottom < pRect.top || cRect.top > pRect.bottom);
        if (overlap) return p;
      }
      return null;
    }

    function clearPortalHover() {
      document.querySelectorAll('.portal').forEach(p => p.classList.remove('drag-hover'));
    }

    initGame();
  </script>
</body>
</html>
